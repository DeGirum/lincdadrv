name: Debian Source Package and Repository build
on:
  workflow_dispatch:
    inputs:
      changelog-description:
        description: "Description of changes for debian changelog file and Github tag."
        type: string
        required: false
        default: ""
jobs:
  Build-DSC-Repo:
    runs-on: ubuntu-24.04
    steps:
      - name: Install prerequisites and set up git
        run: |
          sudo apt update
          sudo apt install gnupg dput dh-make devscripts lintian dpkg-dev reprepro dkms build-essential dh-dkms
          git config --global user.name 'Alexander Bolotov'
          git config --global user.email 'bolotov@degirum.com'
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: workspace
      - name: Check out published APT repository
        uses: actions/checkout@v4
        with:
          repository: DeGirum/DeGirum.github.io
          ref: master
          path: documentation
          token: ${{ secrets.MYTOKEN }}
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.REPO_GPG_PASSPHRASE }}
      - name: Retrieve package version
        run: |
          echo "VERSION=$(grep "^MODULE_VERSION" src/cdadrv.c | cut -c 17-23)" >> "$GITHUB_OUTPUT"
        id: version
        working-directory: ${{ github.workspace }}/workspace
      - name: Report package version
        run: echo "Version ${{ steps.version.outputs.VERSION }} sourced from src/cdadrv.c"
        working-directory: ${{ github.workspace }}/workspace
      - name: Update debian changelog
        if: ${{ github.event.inputs.changelog-description != '' }}
        run: |
          dch --newversion ${{ steps.version.outputs.VERSION }} --controlmaint "${{ github.event.inputs.changelog-description }}"
          dch --release --controlmaint ""
          git add debian/changelog
          git tag -a ${{ steps.version.outputs.VERSION }} -m '${{ github.event.inputs.changelog-description }}'
          git commit -m "Automated update of changelog file."
          git push
          git push --tags
        working-directory: ${{ github.workspace }}/workspace
      - name: Build package
        run: debuild -b
        working-directory: ${{ github.workspace }}/workspace
      - name: upload the debian pkg
        uses: actions/upload-artifact@v4
        with:
          name: cdapci
          path: ${{ github.workspace }}/cdapci-dkms_${{ steps.version.outputs.VERSION}}_all.deb
      - name: Build signed APT repository artifact
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/cdapci-dkms_${{ steps.version.outputs.VERSION }}_all.deb"
          repo="$GITHUB_WORKSPACE/documentation/docs/apt-repo"

          test "$(dpkg-deb -f "$package" Package)" = cdapci-dkms
          test "$(dpkg-deb -f "$package" Version)" = "${{ steps.version.outputs.VERSION }}"
          reprepro -b "$repo" includedeb ORCA "$package"
          reprepro -b "$repo" check ORCA

          tar --exclude='apt-repo/db/lockfile' \
            -czf "$GITHUB_WORKSPACE/orca-apt-repo-${{ steps.version.outputs.VERSION }}.tar.gz" \
            -C "$GITHUB_WORKSPACE/documentation/docs" apt-repo
      - name: Upload signed APT repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-apt-repo-${{ steps.version.outputs.VERSION }}
          path: ${{ github.workspace }}/orca-apt-repo-${{ steps.version.outputs.VERSION }}.tar.gz
      - name: Update tag only
        if: ${{ github.event.inputs.changelog-description == '' }}
        uses: actions/github-script@v5
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.version.outputs.VERSION }}',
              sha: context.sha
            })
